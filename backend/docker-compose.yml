# zabbix-ai-maintenance-v2 — deployment (Req 18.2).
#
# THREE backend instances (aima1..aima3) behind a Caddy TLS reverse proxy.
#
# DEPLOY (recommended) — pull the published image from GHCR, no build needed:
#
#   cp .env.example .env      # then edit .env with your values
#   docker compose pull
#   docker compose up -d
#
# Pin a version by setting AIMA_VERSION in your .env (e.g. AIMA_VERSION=v2.8.0);
# it defaults to `latest`. The image is published by CI to GHCR on every tag.
#
# DEVELOP (build from source instead of pulling) — uncomment the `build:` block
# in the `x-aima-common` anchor below, then:  docker compose up --build -d
#
# Secrets are NEVER inlined here — they come from the `.env` file referenced via
# `env_file` (see .env.example); `.env` is git-ignored and excluded from the
# Docker build context.

x-aima-common: &aima-common
  # Published multi-arch image from GHCR (default deploy path). Override the tag
  # with AIMA_VERSION in .env (defaults to `latest`).
  image: ghcr.io/grovertaipe/ia-sheduler-zabbix:${AIMA_VERSION:-latest}
  # To BUILD FROM SOURCE instead of pulling the published image, uncomment:
  # build:
  #   context: .
  #   dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - aimaintenance_net
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5005/health"]
    interval: 30s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  # --- One-shot certificate generator (runs before Caddy) ---------------------
  # Mints a self-signed cert whose SANs come from AIMA_TLS_HOSTS (comma-separated
  # IPs/FQDNs) plus the always-included loopback names (127.0.0.1 / localhost).
  # Idempotent: if certs/backend.{crt,key} already exist it reuses them and exits
  # 0 without regenerating (so the browser is not re-warned). Writes to the shared
  # ./certs bind mount; exits non-zero on openssl failure so Caddy stays gated.
  #
  # NOTE: shell variables inside `command` are written as `$$VAR` so docker
  # compose does NOT interpolate them — the doubled `$$` becomes a single `$`
  # passed to the container shell. AIMA_TLS_HOSTS is provided via `environment`
  # below and read inside the script as `$$AIMA_TLS_HOSTS`.
  caddy_init:
    image: alpine:3
    container_name: caddy_init
    restart: "no"
    environment:
      - AIMA_TLS_HOSTS=${AIMA_TLS_HOSTS:-}
    networks:
      - aimaintenance_net
    volumes:
      - ./certs:/certs
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /certs/backend.crt ] && [ -f /certs/backend.key ]; then
          echo "reusing existing certificate"
          exit 0
        fi
        apk add --no-cache openssl >/dev/null

        san="IP:127.0.0.1,DNS:localhost"
        cn="localhost"
        first=""

        # Split AIMA_TLS_HOSTS on commas and classify each token.
        old_ifs="$$IFS"
        IFS=','
        for raw in $$AIMA_TLS_HOSTS; do
          # Trim leading/trailing whitespace (POSIX sh).
          token=$$(printf '%s' "$$raw" | sed 's/^[[:space:]]*//; s/[[:space:]]*$$//')
          [ -z "$$token" ] && continue
          if [ -z "$$first" ]; then
            first="$$token"
          fi
          case "$$token" in
            *:*)
              # Contains a colon -> treat as IPv6 literal.
              san="$$san,IP:$$token"
              ;;
            *[!0-9.]*)
              # Has a non-(digit|dot) char -> DNS name.
              san="$$san,DNS:$$token"
              ;;
            *)
              # Only digits and dots -> IPv4 literal.
              san="$$san,IP:$$token"
              ;;
          esac
        done
        IFS="$$old_ifs"

        if [ -n "$$first" ]; then
          cn="$$first"
        else
          echo "WARNING: AIMA_TLS_HOSTS is empty; only loopback (127.0.0.1/localhost) will be covered."
          echo "WARNING: remote access by IP/FQDN will show a certificate name mismatch until AIMA_TLS_HOSTS is set."
        fi

        echo "generating certificate for SANs: $$san"
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout /certs/backend.key -out /certs/backend.crt \
          -subj "/CN=$$cn" -addext "subjectAltName=$$san"

  # --- Inbound TLS reverse proxy (auto-HTTPS, zero-config) --------------------
  # Caddy terminates TLS for the browser/widget and forwards plain HTTP to the
  # backend over the internal network (aima1:5005). By default it serves an
  # auto-generated self-signed certificate whose SANs come from AIMA_TLS_HOSTS
  # (the IPs/FQDNs you deploy behind), minted by the `caddy_init` service before
  # Caddy starts — no domain and no external cert needed. This is the
  # Elasticsearch pattern: HTTPS on by default, the browser warns once, you
  # accept the certificate. Serving an explicit cert (instead of `tls internal`)
  # lets a bare-IP client with no SNI still complete the handshake. See
  # ./Caddyfile for the three supported modes (auto self-signed default /
  # bring-your-own-cert / ACME).
  #
  # In a TLS deployment expose ONLY this proxy (443). The backend instances are
  # NOT published to the host (no `ports:`), so they are reachable only inside
  # the Docker network; point the widget's "Backend API URL" at https://<host>.
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"   # HTTPS (the only port exposed to the host)
      - "80:80"     # HTTP -> redirect / ACME challenges (optional)
    networks:
      - aimaintenance_net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro     # self-signed cert minted by caddy_init (read-only)
      - caddy_data:/data      # persists the auto-generated cert across restarts
      - caddy_config:/config
    depends_on:
      caddy_init:
        condition: service_completed_successfully
      aima1:
        condition: service_started

  aima1:
    <<: *aima-common
    container_name: aima1

  aima2:
    <<: *aima-common
    container_name: aima2

  aima3:
    <<: *aima-common
    container_name: aima3

networks:
  aimaintenance_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.10.0/24

# Named volumes for Caddy so the auto-generated (self-signed) certificate and
# its issuer state persist across restarts — otherwise the browser would see a
# brand-new cert (and warn again) on every `docker compose up`.
volumes:
  caddy_data:
  caddy_config:
